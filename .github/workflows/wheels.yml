name: Wheels

# Per-platform wheels that carry the pinned ukiryu-rs C library, installed
# into clean environments and run against the conformance corpus. Nothing is
# published: the wheels are workflow artifacts only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            plat: manylinux_2_28_x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            plat: manylinux_2_28_aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - name: macos-arm64
            runner: macos-15
            plat: macosx_11_0_arm64
            deployment: '11.0'
          - name: macos-x86_64
            runner: macos-15-intel
            plat: macosx_10_15_x86_64
            deployment: '10.15'
          - name: windows-x86_64
            runner: windows-2022
            plat: win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the core library in the manylinux image
        if: matrix.container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/ukiryu-rs "${{ matrix.container }}" bash -euxo pipefail -c '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "'"$RUST_TOOLCHAIN"'"
            . "$HOME/.cargo/env"
            cargo build -p ukiryu-ffi --release --locked
            chown -R '"$(id -u):$(id -g)"' /w/ukiryu-rs/target
          '
          echo "LIBRARY=$GITHUB_WORKSPACE/ukiryu-rs/target/release/libukiryu_ffi.so" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.container }}
        with:
          workspaces: ukiryu-rs
          key: wheel-${{ matrix.name }}
      - name: Build the core library
        if: ${{ !matrix.container }}
        shell: bash
        working-directory: ukiryu-rs
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          # Static CRT: the wheel must not need the Visual C++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build -p ukiryu-ffi --release --locked
          case "$RUNNER_OS" in
            macOS) lib=libukiryu_ffi.dylib ;;
            Windows) lib=ukiryu_ffi.dll ;;
          esac
          echo "LIBRARY=$GITHUB_WORKSPACE/ukiryu-rs/target/release/$lib" >> "$GITHUB_ENV"
      - name: Build tools
        shell: bash
        run: |
          python -m pip install "setuptools>=70.1" wheel
          case "$RUNNER_OS" in
            Linux) python -m pip install auditwheel ;;
            Windows) python -m pip install pefile ;;
          esac
      - name: Build the wheel
        shell: bash
        run: |
          test -f "$LIBRARY"
          python scripts/build_wheel.py "$LIBRARY" "${{ matrix.plat }}" dist
          ls -l dist
      - name: Check the wheel and record hashes
        shell: bash
        run: |
          mkdir -p evidence
          python scripts/check_wheel.py dist/*.whl "${{ matrix.plat }}" evidence/wheel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.name }}
          path: |
            dist/*.whl
            evidence/wheel.json
          if-no-files-found: error

  install-test:
    name: Install ${{ matrix.target.name }} (Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: linux-x86_64, runner: ubuntu-24.04}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm}
          - {name: macos-arm64, runner: macos-15}
          - {name: macos-x86_64, runner: macos-15-intel}
          - {name: windows-x86_64, runner: windows-2022}
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.target.name }}
          path: artifact
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/clean/Scripts/python.exe"; else py="$RUNNER_TEMP/clean/bin/python"; fi
          echo "PY=$py" >> "$GITHUB_ENV"
          "$py" -m pip install --no-index --no-deps artifact/dist/*.whl
          "$py" -m pip list
          # The tests run from a copy outside the checkout, so the source tree cannot be imported.
          mkdir "$RUNNER_TEMP/run"
          cp -r tests "$RUNNER_TEMP/run/tests"
      - name: Installed-wheel checks
        shell: bash
        working-directory: ${{ runner.temp }}/run
        env:
          UKIRYU_WHEEL_EVIDENCE: ${{ github.workspace }}/artifact/evidence/wheel.json
        run: '"$PY" -I -m unittest discover -s tests/wheel -v'
      - name: Binding tests against the installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}/run
        run: '"$PY" -I -m unittest discover -s tests -p "test_[vae]*.py" -v'
      - name: Conformance corpus against the installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}/run
        env:
          CI: 'true'
          UKIRYU_CONFORMANCE_DIR: ${{ github.workspace }}/ukiryu-rs/corpus/conformance
          UKIRYU_CORPUS_REPORT: ${{ github.workspace }}/corpus-report.json
        run: '"$PY" -I -m unittest discover -s tests -p "test_corpus.py" -v'
      - name: Corpus on the manylinux glibc baseline
        if: startsWith(matrix.target.name, 'linux') && matrix.python == '3.9'
        shell: bash
        run: |
          image=quay.io/pypa/manylinux_2_28_$(uname -m)
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -e CI=true \
            -e UKIRYU_WHEEL_EVIDENCE=/w/artifact/evidence/wheel.json \
            -e UKIRYU_CONFORMANCE_DIR=/w/ukiryu-rs/corpus/conformance "$image" bash -euxo pipefail -c '
              /opt/python/cp39-cp39/bin/python -m venv /tmp/clean
              /tmp/clean/bin/python -m pip install --no-index --no-deps /w/artifact/dist/*.whl
              mkdir /tmp/run && cp -r /w/tests /tmp/run/tests && cd /tmp/run
              ldd --version | head -1
              /tmp/clean/bin/python -I -m unittest discover -s tests/wheel -v
              /tmp/clean/bin/python -I -m unittest discover -s tests -p "test_corpus.py" -v
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report-${{ matrix.target.name }}-py${{ matrix.python }}
          path: corpus-report.json
          if-no-files-found: warn
