name: Wheels

# Per-platform wheels that carry the pinned ukiryu-rs C library, installed
# into clean environments (in the same job, so one slow runner type does not
# hold the others back) and run against the conformance corpus. Nothing is
# published: the wheels are workflow artifacts only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            plat: manylinux_2_28_x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            plat: manylinux_2_28_aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - name: macos-arm64
            runner: macos-15
            plat: macosx_11_0_arm64
            deployment: '11.0'
          - name: macos-x86_64
            runner: macos-15-intel
            plat: macosx_10_15_x86_64
            deployment: '10.15'
          - name: windows-x86_64
            runner: windows-2022
            plat: win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the core library in the manylinux image
        if: matrix.container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/ukiryu-rs "${{ matrix.container }}" bash -euxo pipefail -c '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "'"$RUST_TOOLCHAIN"'"
            . "$HOME/.cargo/env"
            cargo build -p ukiryu-ffi --release --locked
            chown -R '"$(id -u):$(id -g)"' /w/ukiryu-rs/target
          '
          echo "LIBRARY=$GITHUB_WORKSPACE/ukiryu-rs/target/release/libukiryu_ffi.so" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.container }}
        with:
          workspaces: ukiryu-rs
          key: wheel-${{ matrix.name }}
      - name: Build the core library
        if: ${{ !matrix.container }}
        shell: bash
        working-directory: ukiryu-rs
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          # Static CRT: the wheel must not need the Visual C++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build -p ukiryu-ffi --release --locked
          case "$RUNNER_OS" in
            macOS) lib=libukiryu_ffi.dylib ;;
            Windows) lib=ukiryu_ffi.dll ;;
          esac
          echo "LIBRARY=$GITHUB_WORKSPACE/ukiryu-rs/target/release/$lib" >> "$GITHUB_ENV"
      - name: Build tools
        shell: bash
        run: |
          python -m pip install "setuptools>=70.1" wheel
          case "$RUNNER_OS" in
            Linux) python -m pip install auditwheel ;;
            Windows) python -m pip install pefile ;;
          esac
      - name: Build the wheel
        shell: bash
        run: |
          test -f "$LIBRARY"
          python scripts/build_wheel.py "$LIBRARY" "${{ matrix.plat }}" dist
          ls -l dist
      - name: Check the wheel and record hashes
        shell: bash
        run: |
          mkdir -p evidence
          python scripts/check_wheel.py dist/*.whl "${{ matrix.plat }}" evidence/wheel.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: |
            dist/*.whl
            evidence/wheel.json
          if-no-files-found: error
      - name: Install and test on Python 3.9
        uses: ./.github/actions/install-test
        with:
          python: '3.9'
      - name: Install and test on Python 3.13
        if: ${{ !cancelled() }}
        uses: ./.github/actions/install-test
        with:
          python: '3.13'
      - name: Corpus on the manylinux glibc baseline
        if: ${{ !cancelled() && matrix.container }}
        shell: bash
        run: |
          image="${{ matrix.container }}"
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -e CI=true \
            -e UKIRYU_WHEEL_EVIDENCE=/w/evidence/wheel.json \
            -e UKIRYU_CONFORMANCE_DIR=/w/ukiryu-rs/corpus/conformance "$image" bash -euxo pipefail -c '
              /opt/python/cp39-cp39/bin/python -m venv /tmp/clean
              /tmp/clean/bin/python -m pip install --no-index --no-deps /w/dist/*.whl
              mkdir /tmp/run && cp -r /w/tests /tmp/run/tests && cd /tmp/run
              ldd --version | head -1
              /tmp/clean/bin/python -I -m unittest discover -s tests/wheel -v
              /tmp/clean/bin/python -I -m unittest discover -s tests -p "test_corpus.py" -v
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report-${{ matrix.name }}
          path: corpus-report-*.json
          if-no-files-found: warn

